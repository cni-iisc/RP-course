<script>
window.katexMacros = {
  "\\set": "\\left\\{#1\\right\\}",
  "\\abs": "\\left\\lvert#1\\right\\rvert",
  "\\norm": "\\left\\lVert#1\\right\\rVert",
  "\\inner": "\\left\\langle #1\\right\\rangle",
  "\\floor": "\\left\\lfloor#1\\right\\rfloor",
  "\\ceil": "\\left\\lceil#1\\right\\rceil",
  "\\given": "\\; \\big\\vert \\;",
  "\\Ind": "\\mathbb{1}_{#1}",
  "\\SetIn": "\\mathbb{1}_{\\left\\{#1\\right\\}}",
  "\\mathbbm": "\\mathbb{#1}",
  "\\iid": "\\emph{i.i.d.}",
  "\\EQ": "\\begin{equation*}#1\\end{equation*}",
  "\\EQN": "\\begin{equation}#1\\end{equation}",
  "\\eq": "\\begin{aligned}#1\\end{aligned}",
  "\\meq": "{#1}\\begin{aligned}#2\\end{aligned}",
  "\\tr": "\\operatorname{tr}",
  "\\Var": "\\operatorname{Var}",
  "\\Cov": "\\operatorname{Cov}",
  "\\cov": "\\operatorname{cov}",
  "\\expect": "\\mathbb{E}\\left[#1\\right]",
  "\\prob": "\\mathbb{P}\\left[#1\\right]",
  "\\E": "\\mathbb{E}",
  "\\P": "\\mathbb{P}",
  "\\F": "\\mathbb{F}",
  "\\N": "\\mathbb{N}",
  "\\R": "\\mathbb{R}",
  "\\Z": "\\mathbb{Z}",
  "\\Q": "\\mathbb{Q}",
  "\\C": "\\mathbb{C}",
  "\\D": "\\mathbb{D}",
  "\\cC": "\\mathcal{C}",
  "\\cF": "\\mathcal{F}",
  "\\cM": "\\mathcal{M}",
  "\\cT": "\\mathcal{T}",
  "\\sA": "\\mathscr{A}",
  "\\sB": "\\mathscr{B}",
  "\\sE": "\\mathscr{E}",
  "\\sF": "\\mathscr{F}",
  "\\sG": "\\mathscr{G}",
  "\\sH": "\\mathscr{H}",
  "\\sL": "\\mathscr{L}",
  "\\sX": "\\mathscr{X}",
  "\\sY": "\\mathscr{Y}",
  "\\cP": "\\mathcal{P}",
  "\\indicator": "\\mathbb{1}_{#1}",
  "\\bigtimes": "\\mathop{\\Large\\times}\\limits",
  "\\bU": "\\mathbf{1}",
  "\\bA": "\\mathbf{A}",
  "\\bx": "\\mathbf{x}",
  "\\bX": "\\mathbf{X}",
  "\\bZ": "\\mathbf{Z}",
  "\\tS": "\\tilde{S}",
  "\\bigo": "\\mathcal{O}",
  "\\goto": "\\rightarrow",
  "\\matlab": "\\text{MATLAB}",
  "\\reals": "{\\rm l}\\kern-.15em {\\rm R}",
  "\\complex": "{\\raisebox{.043ex}{\\rule{0.07em}{1.56ex}} \\hskip -.35em {\\rm C}}",
  "\\meqalign": "\\begin{aligned}#1\\end{aligned}"
};

document.addEventListener("DOMContentLoaded", function () {
  if (!window.katex) return;
  var mathElements = Array.from(document.getElementsByClassName("math"));
  mathElements.forEach(function (el) {
    var texText = el.firstChild;
    if (el.tagName == "SPAN" && texText && texText.data) {
      window.katex.render(texText.data, el, {
        displayMode: el.classList.contains("display"),
        throwOnError: false,
        macros: window.katexMacros,
        fleqn: false
      });
      // Pandoc's own katex script also typesets ".math" spans on
      // DOMContentLoaded with no macros; drop the class so its pass
      // (which runs after this one) finds nothing left to redo.
      el.classList.remove("math");
    }
  });
});
</script>
